# Render Blueprint — New → Blueprint → chọn repo. Render tự cấp PORT, CMD trong Dockerfile đọc nó.
# rootDir trỏ vào 06-lab-complete vì repo nộp bài có nhiều thư mục.
services:
  - type: web
    name: day14-production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, xem trong tab Environment
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []                  # chỉ cho kết nối nội bộ trong Render
