# Railway — build từ Dockerfile, CMD trong Dockerfile lắng nghe theo $PORT do Railway cấp.
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong tab Variables của service, không ghi ở đây:
#   railway variables --set "AGENT_API_KEY=..." --set 'REDIS_URL=${{Redis.REDIS_URL}}'

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
